version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-taskflow}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-taskflow_password}
      POSTGRES_DB: ${DATABASE_NAME:-taskflow_db}
    ports:
      - '5432:5432'
    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-taskflow} -d ${DATABASE_NAME:-taskflow_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: development
    container_name: taskflow_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
    ports:
      - '3001:3001'
    volumes:
      - ./src:/usr/src/app/src
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start:dev

volumes:
  taskflow_postgres_data:
